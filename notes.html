<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Siu's Clinical Master</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .full { grid-column: span 3; }
        .span-2 { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .section-header { grid-column: span 3; font-weight: bold; font-size: 12px; color: #007bff; border-bottom: 1px solid #e7f3ff; padding-bottom: 4px; margin-top: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-gen:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: white; }
        #output { margin-top: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-left: 5px solid #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #222; min-height: 300px; line-height: 1.1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Siu's Master Note Generator</h2>

    <div class="grid">
        <div class="full">
            <label>1. Select Procedure Template</label>
            <select id="proc">
                <optgroup label="Exams">
                    <option value="np_exam">NP EXAM</option>
                    <option value="spec_exam">SPEC EXAM / EMERGENCY</option>
                    <option value="recall">RECALL EXAM</option>
                </optgroup>
                <optgroup label="Restorative">
                    <option value="composite">COMPOSITE BONDING</option>
                    <option value="pulp_cap">INDIRECT PULP CAP</option>
                    <option value="crown_prep">CROWN & CORE BUILDUP</option>
                    <option value="crack_crown">CRACKED TOOTH CROWN</option>
                    <option value="crown_del">CROWN DELIVERY</option>
                    <option value="fiber_post">FIBER POST & CORE BUILDUP</option>
                </optgroup>
                <optgroup label="Surgery & Endo">
                    <option value="surg_ext">SURGICAL EXTRACTION</option>
                    <option value="simple_ext">SIMPLE EXTRACTION</option>
                    <option value="endo">ENDO TREATMENT (RCT)</option>
                </optgroup>
                <optgroup label="Removable (Dentures)">
                    <option value="prelim_imp">PRELIMINARY IMPRESSION</option>
                    <option value="final_imp">FINAL IMPRESSION</option>
                    <option value="occ_records">OCCLUSAL RECORDS (WAX RIM)</option>
                    <option value="wax_tryin">WAX TRY-IN</option>
                    <option value="cd_del">CD DELIVERY</option>
                </optgroup>
                <optgroup label="Occlusal Guard">
                    <option value="og_scan">OCCLUSAL GUARD SCAN</option>
                    <option value="og_del">OCCLUSAL GUARD DELIVERY</option>
                </optgroup>
            </select>
        </div>

        <div class="full">
            <label>2. Narrative Dropdown</label>
            <select id="narrative">
                <option value="">-- None --</option>
                <option value="bruxism">Bruxism/Clenching Narrative</option>
                <option value="pulp_narrative">Indirect Pulp Cap Justification</option>
                <option value="non_restorable">Non-Restorable/Hopeless Narrative</option>
                <option value="decline_rct">Decline RCT Narrative</option>
                <option value="deep_decay">Deep Decay / Potential RCT Warning</option>
            </select>
        </div>

        <div class="span-2">
            <label>Chief Concern (CC)</label>
            <input type="text" id="ccManual" placeholder="e.g. Pain on biting upper right">
        </div>
        <div>
            <label>Teeth # and Surface</label>
            <input type="text" id="teethSurface" placeholder="e.g. 19-MOD">
        </div>

        <div class="section-header">NP Exam / Special Exam Details</div>
        <div>
            <label>Blood Pressure (BP)</label>
            <input type="text" id="bp" placeholder="e.g. 120/80">
        </div>
        <div>
            <label>Occl Classification</label>
            <input type="text" id="occlClass" placeholder="e.g. cl1">
        </div>
        <div>
            <label>Overjet (OJ)</label>
            <input type="text" id="oj" placeholder="e.g. 2-3mm">
        </div>
        <div>
            <label>Overbite (OB)</label>
            <input type="text" id="ob" placeholder="e.g. 50%">
        </div>

        <div class="span-2">
            <label>Clinical Caries (EOE/IOE Findings)</label>
            <input type="text" id="clinCaries" placeholder="e.g. caries noted on chart">
        </div>

        <div class="section-header">Imaging & Perio</div>
        <div class="span-2">
            <label>Radiographic Caries (X-Ray Findings)</label>
            <input type="text" id="radCaries" placeholder="e.g. caries noted on chart">
        </div>
        <div>
            <label>Imaging Taken</label>
            <input type="text" id="imaging" placeholder="e.g. 4BWs, Pano">
        </div>
        <div>
            <label>Scaling Units</label>
            <select id="scaling">
                <option value="0">0 units</option><option value="1">1 unit</option><option value="2">2 units</option><option value="3" selected>3 units</option><option value="4">4 units</option>
            </select>
        </div>
        <div>
            <label>Anesthetic Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="citanest plain">Citanest Plain</option>
            </select>
        </div>
        <div>
            <label>Anes Amount (Carps)</label>
            <select id="anesCarps">
                <option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
            </select>
        </div>

        <div class="section-header">Endo / Restorative Specs</div>
        <div class="span-2">
            <label>Endo Diagnosis</label>
            <input type="text" id="endoDx" placeholder="e.g. Symptomatic Irreversible Pulpitis">
        </div>
        <div>
            <label>Material / Shade</label>
            <input type="text" id="shade" placeholder="e.g. Zirconia / A2">
        </div>
    </div>

    <button onclick="generate()">Generate Note</button>
    <div id="output">Generated note will appear here...</div>
    <button class="btn-copy" onclick="copyText()">Copy to Clipboard</button>
</div>

<script>
    function generate() {
        const proc = document.getElementById('proc').value;
        const narr = document.getElementById('narrative').value;
        const teeth = document.getElementById('teethSurface').value || "[#]";
        const shade = document.getElementById('shade').value || "[SHADE]";
        const cc = document.getElementById('ccManual').value || "none";
        const bp = document.getElementById('bp').value || "not recorded";
        const endoDx = document.getElementById('endoDx').value || "[ENDO DX]";
        const img = document.getElementById('imaging').value || "None";
        const scal = document.getElementById('scaling').value;
        
        const occl = document.getElementById('occlClass').value || "cl1";
        const oj = document.getElementById('oj').value || "2-3mm";
        const ob = document.getElementById('ob').value || "50%";
        const clinCaries = document.getElementById('clinCaries').value || "caries noted on chart";
        const radCaries = document.getElementById('radCaries').value || "caries noted on chart";
        
        const anes = document.getElementById('anesCarps').value + " carp " + document.getElementById('anesType').value;
        const sig = "RSiu DMD; Assistant Leng.";
        const consent = "consent: risks, benefits, and alternatives discussed; patient understood all risks and consented to treatment.";
        const complications = "complications: none; patient tolerated procedure well.";

        let lines = [];
        let narrativeBlock = "";

        if (proc === "np_exam") {
            lines.push(`tx: np exam, 4bws, pano, ${scal}unit scale, polish/fluoride application.\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed and updated; patient stable asa 1. bp: ${bp}`);
            lines.push(`ocs: negative for lesions or lymphadenopathy`);
            lines.push(`dental hx: ldv 1 yr ago. hygiene: fair, brush 1x daily, flosses 1x nightly.`);
            lines.push(`eoe/ioe: ${occl} occlusion, ${oj} oj, ${ob} ob. tmj: wnl. soft tissue wnl. ${clinCaries}.`);
            lines.push(`xrays: findings: ${radCaries}. bone wnl. lower anterior radiographic calc. justification: screen for pathology.`);
            lines.push(`perio dx: gingivitis w/ recession. probing: 1-3mm with localized bop. caries risk: moderate.`);
            lines.push(`hyg: piezo, hs, ohi reviewed. polished. fluoride applied. 6mr recommended.`);
            lines.push(consent);
            lines.push(`nv: restore`);
        } 
        else if (proc === "spec_exam") {
            lines.push(`tx: spec exam, pa.\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed and updated; stable asa 1. bp: ${bp}`);
            lines.push(`eoe/ioe: no swelling. findings: ${clinCaries}.`);
            lines.push(`xrays: pa tooth #${teeth}. findings: ${radCaries}.`);
            lines.push(`tests: perc (+/-), palp (+/-), cold (+/-), mob (0/1/2/3).`);
            lines.push(`dx: ${endoDx}`);
            lines.push(`tx: (adjust/rx/pulp).`);
            lines.push(consent);
            lines.push(`nv: `);
        }
        else if (proc === "composite") {
            lines.push(`tx: ${teeth} composite restoration\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives/post-op sensitivity warning discussed and consented; anes ${anes}; cotton roll isolation; prep w/ hs/ls burs for caries removal; matrix w/ garrison sectional system and wooden wedge; bond w/ selective enamel etch, clearfil se primer (20s) and bond, light-cured; restorative w/ filtek supreme incremental application, light-cured; occlusion checked/adjusted; polished.`);
            lines.push(complications);
            lines.push(`nv: (list next tooth or 6mr)`);
        }
        else if (proc === "pulp_cap") {
            lines.push(`tx: ${teeth} composite w/ indirect pulp cap\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives/post-op sensitivity warning discussed and consented; warning: advised patient that due to deep decay, rct may be needed if sensitivity persists/worsens, and crown may be required in future; anes ${anes}; cotton roll isolation; prep w/ hs/ls burs for caries removal; indirect pulp cap placed w/ (dycal/vitrebond/limelite); matrix w/ garrison sectional system and wooden wedge; bond w/ selective enamel etch, clearfil se primer (20s) and bond, light-cured; restorative w/ filtek supreme incremental application, light-cured; occlusion checked/adjusted; polished.`);
            lines.push(complications);
            lines.push(`nv: (monitor tooth/6mr)`);
        }
        else if (proc === "crown_prep") {
            lines.push(`tx: ${teeth} (${shade}) crown, ${teeth} core buildup\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`narrative: tooth ${teeth} presents with deep caries and a defective existing restoration impacting structural integrity; crown is required to ensure tooth can function and to protect remaining cusps from fracture.`);
            lines.push(`tx rendered: risks/benefits/alternatives/post-op sensitivity warning discussed and consented; anes ${anes}; cotton roll isolation; prep w/ hs/ls burs for caries removal; core buildup placed w/ (limelite/vitrebond) base, selective enamel etch, clearfil se primer (20s) and bond, light-cured, and filtek supreme composite, light-cured; crown prep completed; shade selected: ${shade}; digital impression taken w/ trios 3 scanner; temp crown fabricated w/ bis-acrylic provisional material and cemented w/ temp-bond ne; excess cement removed; occlusion checked/adjusted; polished; flossed checked.`);
            lines.push(complications);
            lines.push(`nv: crown delivery`);
        }
        else if (proc === "crack_crown") {
            lines.push(`tx: 27211 crown, 2331x buildup on ${teeth}\n`);
            lines.push(`cc: pain on biting/cold`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives/post-op sensitivity warning; warning: potential for rct/ext discussed if symptoms persist; anes ${anes}; cotton isolation; prep w/ hs/ls; caries/old restoration removed; crack traced w/ tooth sleuth; core buildup w/ (limelite/vitrebond) base, selective enamel etch, clearfil se primer (20s) and bond, light-cured, and filtek supreme composite, light-cured; crown prep; shade ${shade}; trios 3 scan; bis-acrylic temp cemented w/ temp-bond ne; excess removed; occlusion adjusted; polished; flossed checked.`);
            lines.push(complications);
            lines.push(`nv: crown delivery`);
        }
        else if (proc === "crown_del") {
            lines.push(`tx: 27211 crown delivery\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: temp crown removed; crown prep cleaned; permanent (${shade}) crown tried in; fit, margins, and shade verified; pre-cementation xray taken to confirm marginal fit; interproximal contacts checked/flossed; occlusion checked/adjusted; crown internal surface treated; cemented w/ g-cem one; excess cement removed; post-op xray taken to confirm no residual cement; occlusion re-checked; polished; flossed checked. post-op: advised patient to avoid sticky/hard foods for 24 hours; maintain hygiene around margins.`);
            lines.push(complications);
            lines.push(`nv: 6mr`);
        }
        else if (proc === "fiber_post") {
            lines.push(`tx: ${teeth} fiber post and core buildup\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives discussed and consented; isolation w/ (rubber dam/cotton rolls); post space created using (list drill size/system) to depth of ( )mm; canal cleaned/dried; post tried-in and adjusted; canal etched and bonded w/ clearfil se primer/bond; fiber post cemented w/ (list cement e.g., paracore/g-cem); core buildup completed w/ filtek supreme composite, light-cured; crown prep refined.`);
            lines.push(complications);
            lines.push(`nv: crown delivery`);
        }
        else if (proc === "surg_ext") {
            lines.push(`tx: ${teeth} surgical extraction\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives discussed and consented: pain, swelling, infection, dry socket, fracture of adjacent teeth/restorations, and paresthesia; anes ${anes}; mucoperiosteal flap reflected; bone removed w/ surgical hs bur under saline irrigation; tooth sectioned and roots delivered; socket curetted/debrided; bone file used; saline irrigation; ( ) interrupted gut plain sutures placed; hemostasis achieved.`);
            lines.push(complications);
            lines.push(`post-op: poi given (written/verbal); no smoking/straws/spitting.`);
            lines.push(`nv: 1wk post-op`);
        }
        else if (proc === "simple_ext") {
            lines.push(`tx: ${teeth} extraction\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: risks/benefits/alternatives/post-op sensitivity/paresthesia/fracture of adj teeth discussed and consented; anes ${anes}; luxated and delivered w/ elevators and forceps; socket curetted; saline irrigation; hemostasis achieved. post-op: poi given; no smoking/straws/spitting.`);
            lines.push(complications);
            lines.push(`nv: healing check`);
        }
        else if (proc === "endo") {
            lines.push(`tx: ${teeth} RCT\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`dx: ${endoDx}`);
            lines.push(`anes: ${anes}`);
            lines.push(`tx rendered: risks/benefits/alternatives discussed and consented; rubber dam isolation; access w/ hs bur; canals located; glide path established to #15 hand file; mechanical instrumentation using Vortex Blue 0.04 taper rotary files (40, 35, 30, 25); irrigation w/ NaOCl and EDTA; ultrasonic activation of irrigants; canals dried; obturated using single cone technique w/ gutta-percha and bioceramic sealer; orifice sealed; temp restoration; occlusion adjusted.`);
            lines.push(complications);
            lines.push(`nv: crown/core`);
        }
        else if (proc === "prelim_imp") {
            lines.push(`tx: prelim imps max/mand for custom trays\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`ioe: u/l arches edentulous, soft tissue wnl.`);
            lines.push(`imps: max/mand alginate in stock trays, good border extension, landmarks captured.`);
            lines.push(`consent: risks/benefits/alternatives discussed.`);
            lines.push(`nv: final imps.`);
        }
        else if (proc === "occ_records") {
            lines.push(`tx: wax rim adjustment, jaw relation records\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`ioe: max rim adjusted for lip support/midline/smile line/canine position. mand rim adjusted for vdo/vdr (3mm freeway space). cr record captured w/ aluwax. shade/mold: ${shade} selected w/ patient. patient approved esthetics.`);
            lines.push(`consent: risks/benefits/alternatives discussed.`);
            lines.push(`nv: wax try-in.`);
        }
        else if (proc === "cd_del") {
            lines.push(`tx: delivery of u/l complete dentures\n`);
            lines.push(`cc: none`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`ioe: dentures seated; pip paste used to identify/relieve pressure spots. occlusion: verified in cr; selective grinding performed. stability/retention: good.`);
            lines.push(`ohi: brush 2x daily, soak nightly, do not sleep in dentures, 24hr follow-up explained.`);
            lines.push(`consent: signed.`);
            lines.push(`nv: post-op f/u.`);
        }
        else if (proc === "og_scan") {
            lines.push(`tx: occlusal guard, trios 3 scan\n`);
            lines.push(`cc: morning jaw soreness/headaches; attrition noted.`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`narrative: patient presents with signs of clinical bruxism including generalized attrition, wear facets, and abfraction. occlusal guard is medically necessary to protect dentition from further tooth structure loss, manage myofascial pain, and prevent fracture of existing restorations/teeth.`);
            lines.push(`tx rendered: risks/benefits/alternatives discussed; digital impression taken w/ trios 3 scanner (upper/lower/bite); shade/material selected: ${shade}.`);
            lines.push(`nv: occlusal guard delivery.`);
        }
        else {
            lines.push(`tx: ${proc.toUpperCase()} on ${teeth}\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: reviewed/updated. bp: ${bp}`);
            lines.push(`tx rendered: clinical procedure completed as per protocol.`);
            lines.push(complications);
        }

        if (narr === "bruxism") narrativeBlock = "\nnarrative: evidence of bruxism/clenching with significant attrition and wear facets. occlusal guard required to protect against further tooth wear.";
        if (narr === "pulp_narrative") narrativeBlock = `\nnarrative: teeth ${teeth} presents with deep caries and a defective existing restoration impacting structural integrity; crown is required to ensure tooth can function and to protect remaining cusps from fracture.`;
        if (narr === "non_restorable") narrativeBlock = `\nnarrative: teeth ${teeth} non-restorable/hopeless due to deep subgingival caries, severe lack of tooth structure (no ferrule), and significant periodontal compromise. extraction medically necessary to eliminate infection.`;
        if (narr === "decline_rct") narrativeBlock = `\nnarrative: teeth ${teeth} non-restorable due to extensive caries/fracture. patient declined RCT and elects for extraction. tooth is deemed hopeless without endodontic intervention.`;
        if (narr === "deep_decay") narrativeBlock = "\nwarning: advised patient that due to deep decay, rct may be needed if sensitivity persists/worsens.";

        document.getElementById('output').innerText = lines.join('\n') + narrativeBlock + "\n\n" + sig;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Note Copied!"); });
    }
</script>

</body>
</html>
