<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Siu's Master Note Generator</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 850px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .full { grid-column: span 3; }
        .span-2 { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .section-header { grid-column: span 3; font-weight: bold; font-size: 12px; color: #007bff; border-bottom: 1px solid #e7f3ff; padding-bottom: 5px; margin-top: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-gen:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: white; }
        /* line-height 1.1 and padding 20px for tight, professional look */
        #output { margin-top: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-left: 5px solid #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #222; min-height: 250px; line-height: 1.1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Siu's Master Note Generator</h2>

    <div class="grid">
        <div class="full">
            <label>1. Select Procedure Template</label>
            <select id="proc">
                <optgroup label="Exams">
                    <option value="np_exam">NP EXAM</option>
                    <option value="recall">RECALL EXAM</option>
                    <option value="spec_exam">SPEC EXAM / EMERGENCY</option>
                </optgroup>
                <optgroup label="Restorative">
                    <option value="composite">COMPOSITE BONDING</option>
                    <option value="pulp_cap">INDIRECT PULP CAP</option>
                    <option value="crown_prep">CROWN & CORE BUILDUP</option>
                    <option value="crown_del">CROWN DELIVERY</option>
                    <option value="fiber_post">FIBER POST & CORE</option>
                </optgroup>
                <optgroup label="Surgery & Endo">
                    <option value="simple_ext">SIMPLE EXTRACTION</option>
                    <option value="surg_ext">SURGICAL EXTRACTION</option>
                    <option value="endo">ENDO TREATMENT (RCT)</option>
                </optgroup>
            </select>
        </div>

        <div class="span-2">
            <label>Chief Concern (CC)</label>
            <input type="text" id="ccManual" placeholder="e.g. Pain on biting upper right">
        </div>
        <div>
            <label>Tooth #</label>
            <input type="text" id="tooth" placeholder="e.g. 19">
        </div>

        <div class="section-header">Imaging / Hygiene</div>
        <div>
            <label>X-Rays Taken</label>
            <input type="text" id="imaging" placeholder="e.g. 4BWs, 2PAs, Pano">
        </div>
        <div>
            <label>Scaling Units</label>
            <select id="scaling">
                <option value="0">0 units</option><option value="1">1 unit</option><option value="2">2 units</option><option value="3" selected>3 units</option><option value="4">4 units</option>
            </select>
        </div>
        <div>
            <label>Root Planing Units</label>
            <select id="srp">
                <option value="0" selected>0 units</option><option value="1">1 unit</option><option value="2">2 units</option>
            </select>
        </div>

        <div class="section-header">Clinical Details</div>
        <div class="span-2">
            <label>Endo Diagnosis</label>
            <input type="text" id="endoDx" placeholder="e.g. Symptomatic Irreversible Pulpitis">
        </div>
        <div>
            <label>Surface / Shade</label>
            <input type="text" id="detail" placeholder="e.g. MOD / A2">
        </div>

        <div>
            <label>Anesthetic Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="citanest plain">Citanest Plain</option>
            </select>
        </div>
        <div>
            <label>Anes Amount</label>
            <select id="anesCarps">
                <option value="1">1 carp</option><option value="2">2 carps</option><option value="0.5">0.5 carp</option>
            </select>
        </div>
        <div class="full">
            <label>Caries Findings</label>
            <input type="text" id="caries" placeholder="e.g. #3-MOD, #14-O caries noted">
        </div>
    </div>

    <button class="btn-gen" onclick="generate()">Generate Note</button>
    <div id="output">Generated note will appear here...</div>
    <button class="btn-copy" onclick="copyText()">Copy to Clipboard</button>
</div>

<script>
    function generate() {
        const proc = document.getElementById('proc').value;
        const tooth = document.getElementById('tooth').value || "[#]";
        const detail = document.getElementById('detail').value || "[DETAIL]";
        const cc = document.getElementById('ccManual').value || "none";
        const endoDx = document.getElementById('endoDx').value || "[ENDO DX]";
        const img = document.getElementById('imaging').value || "None";
        const scal = document.getElementById('scaling').value;
        const anes = document.getElementById('anesCarps').value + " carp " + document.getElementById('anesType').value;
        const caries = document.getElementById('caries').value || "caries noted on chart.";
        
        const consent = "consent: risks and benefits discussed; patient consented to treatment.";
        const sig = "RSiu DMD; Assistant Leng.";

        let lines = [];

        if (proc === "np_exam") {
            lines.push(`tx: np exam, ${img}, ${scal}u scale, polish/fluoride application.`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`ocs: negative for lesions or lymphadenopathy`);
            lines.push(`xrays: ${img} taken to assess for caries/pathology. bone wnl.`);
            lines.push(`caries: ${caries}`);
            lines.push(`perio dx: gingivitis`);
            lines.push(`probing: 1-3mm`);
            lines.push(`hyg: ${scal}u scaling performed. polished. fluoride applied.`);
            lines.push(consent);
            lines.push(`nv: restore`);
        } 
        else if (proc === "composite") {
            lines.push(`tx: #${tooth} ${detail} composite`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`tx rendered: risks/benefits/post-op sensitivity warning discussed`);
            lines.push(`anes: ${anes}`);
            lines.push(`isolation: cotton roll`);
            lines.push(`prep: hs/ls burs for caries removal`);
            lines.push(`restoration: selective etch; bond w/ clearfil se; filtek supreme; occlusion adjusted; polished`);
            lines.push(consent);
            lines.push(`nv: 6mr`);
        }
        else if (proc === "endo") {
            lines.push(`tx: #${tooth} RCT`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`dx: ${endoDx}`);
            lines.push(`anes: ${anes}`);
            lines.push(`isolation: rubber dam`);
            lines.push(`tx rendered: instrumentation using Vortex Blue; bioceramic sealer; orifice sealed; temp restoration`);
            lines.push(consent);
            lines.push(`nv: crown/core`);
        }
        else {
            lines.push(`tx: ${proc.toUpperCase()} on #${tooth}`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`tx rendered: procedure completed as per protocol`);
            lines.push(consent);
        }

        // Using join('\n\n') creates exactly one blank line between each item.
        document.getElementById('output').innerText = lines.join('\n\n') + "\n\n" + sig;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Copied!"); });
    }
</script>

</body>
</html>
