<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Siu's Note Generator</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 850px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .full { grid-column: span 3; }
        .span-2 { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .section-header { grid-column: span 3; font-weight: bold; font-size: 12px; color: #007bff; border-bottom: 1px solid #e7f3ff; padding-bottom: 4px; margin-top: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-gen:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: white; }
        /* Tighter line-height to prevent double-spacing in clinical block */
        #output { margin-top: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-left: 5px solid #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #222; min-height: 250px; line-height: 1.1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Siu's Master Note Generator</h2>

    <div class="grid">
        <div class="full">
            <label>1. Select Procedure Template</label>
            <select id="proc">
                <optgroup label="Exams">
                    <option value="np_exam">NP EXAM</option>
                    <option value="recall">RECALL EXAM</option>
                    <option value="spec_exam">SPEC EXAM / EMERGENCY</option>
                </optgroup>
                <optgroup label="Restorative">
                    <option value="composite">COMPOSITE BONDING</option>
                    <option value="pulp_cap">INDIRECT PULP CAP</option>
                    <option value="crown_prep">CROWN & CORE BUILDUP</option>
                    <option value="crown_del">CROWN DELIVERY</option>
                </optgroup>
                <optgroup label="Surgery & Endo">
                    <option value="simple_ext">SIMPLE EXTRACTION</option>
                    <option value="surg_ext">SURGICAL EXTRACTION</option>
                    <option value="endo">ENDO TREATMENT (RCT)</option>
                </optgroup>
            </select>
        </div>

        <div class="full">
            <label>2. Narrative / Warning Dropdown</label>
            <select id="narrative">
                <option value="">-- None --</option>
                <option value="bruxism">Bruxism/Clenching Narrative</option>
                <option value="hopeless">Extraction Narrative (Non-restorable)</option>
                <option value="decline_rct">Patient Declines RCT Narrative</option>
                <option value="deep_decay">Deep Decay / Potential RCT Warning</option>
            </select>
        </div>

        <div class="span-2">
            <label>Chief Concern (CC)</label>
            <input type="text" id="ccManual" placeholder="e.g. Pain on biting upper right">
        </div>
        <div>
            <label>Teeth # and Surface</label>
            <input type="text" id="teethSurface" placeholder="e.g. 19-MOD">
        </div>

        <div class="section-header">Imaging & Periodontal</div>
        <div>
            <label>X-Rays Taken</label>
            <input type="text" id="imaging" placeholder="e.g. 4BWs, Pano">
        </div>
        <div>
            <label>Scaling Units</label>
            <select id="scaling">
                <option value="0">0 units</option><option value="1">1 unit</option><option value="2">2 units</option><option value="3" selected>3 units</option><option value="4">4 units</option>
            </select>
        </div>
        <div>
            <label>Root Planing Units</label>
            <select id="srp">
                <option value="0" selected>0 units</option><option value="1">1 unit</option><option value="2">2 units</option>
            </select>
        </div>

        <div class="full">
            <label>Radiographic Caries (X-Ray Findings)</label>
            <input type="text" id="radCaries" placeholder="e.g. #3-D, #14-M radiolucencies noted">
        </div>

        <div class="section-header">EOE/IOE & Clinical Findings</div>
        <div class="full">
            <label>Clinical Caries (EOE/IOE Findings)</label>
            <input type="text" id="clinCaries" placeholder="e.g. #3-O, #19-MOD cavitation noted">
        </div>

        <div class="section-header">Restorative / Endo Details</div>
        <div class="span-2">
            <label>Endo Diagnosis</label>
            <input type="text" id="endoDx" placeholder="e.g. Symptomatic Irreversible Pulpitis">
        </div>
        <div>
            <label>Material / Shade</label>
            <input type="text" id="shade" placeholder="e.g. Zirconia / A2">
        </div>

        <div>
            <label>Anesthetic Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="citanest plain">Citanest Plain</option>
            </select>
        </div>
        <div>
            <label>Anes Amount (Carps)</label>
            <select id="anesCarps">
                <option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
            </select>
        </div>
    </div>

    <button class="btn-gen" onclick="generate()">Generate Note</button>
    <div id="output">Generated note will appear here...</div>
    <button class="btn-copy" onclick="copyText()">Copy to Clipboard</button>
</div>

<script>
    function generate() {
        const proc = document.getElementById('proc').value;
        const narr = document.getElementById('narrative').value;
        const teeth = document.getElementById('teethSurface').value || "[#]";
        const detail = document.getElementById('shade').value || "[SHADE]";
        const cc = document.getElementById('ccManual').value || "none";
        const endoDx = document.getElementById('endoDx').value || "[ENDO DX]";
        const img = document.getElementById('imaging').value || "None";
        const scal = document.getElementById('scaling').value;
        
        const clinCaries = document.getElementById('clinCaries').value || "no significant clinical caries noted.";
        const radCaries = document.getElementById('radCaries').value || "no significant radiographic caries noted.";
        
        const anes = document.getElementById('anesCarps').value + " carp " + document.getElementById('anesType').value;
        const consent = "consent: risks/benefits discussed; patient consented to treatment.";
        const sig = "RSiu DMD; Assistant Leng.";

        let lines = [];

        // Procedure Headings
        if (proc === "np_exam") {
            lines.push(`tx: np exam, ${img}, ${scal}u scale, polish/fluoride application.\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`eoe/ioe: findings: ${clinCaries}`);
            lines.push(`ocs: negative for lesions or lymphadenopathy`);
            lines.push(`xrays: ${img} taken. findings: ${radCaries}. bone levels wnl.`);
            lines.push(`perio dx: gingivitis`);
            lines.push(`probing: 1-3mm`);
            lines.push(`hyg: ${scal}u scaling performed. polished. fluoride applied.`);
            lines.push(consent);
            lines.push(`nv: restore`);
        } 
        else if (proc === "composite") {
            lines.push(`tx: teeth ${teeth} composite restoration\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`tx rendered: risks/benefits/post-op sensitivity warning discussed`);
            lines.push(`anes: ${anes}`);
            lines.push(`isolation: cotton roll`);
            lines.push(`prep: hs/ls burs for caries removal`);
            lines.push(`restoration: selective etch; bond w/ clearfil se; filtek supreme (${detail}); occlusion adjusted; polished`);
            lines.push(consent);
        }
        else if (proc === "endo") {
            lines.push(`tx: tooth ${teeth} RCT\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`dx: ${endoDx}`);
            lines.push(`anes: ${anes}`);
            lines.push(`isolation: rubber dam`);
            lines.push(`tx rendered: instrumentation using Vortex Blue; bioceramic sealer; orifice sealed; temp restoration`);
            lines.push(consent);
        }
        else {
            lines.push(`tx: ${proc.toUpperCase()} on ${teeth}\n`);
            lines.push(`cc: ${cc}`);
            lines.push(`mh: asa 1`);
            lines.push(`tx rendered: procedure completed per protocol`);
            lines.push(consent);
        }

        // Narratives
        let narrativeBlock = "";
        if (narr === "bruxism") narrativeBlock = "\nnarrative: evidence of bruxism/clenching with significant attrition. occlusal guard required to protect against further wear.";
        if (narr === "hopeless") narrativeBlock = `\nnarrative: teeth ${teeth} non-restorable/hopeless due to deep subgingival caries. extraction medically necessary to eliminate infection.`;
        if (narr === "decline_rct") narrativeBlock = `\nnarrative: patient declined RCT for teeth ${teeth} and elects for extraction. tooth is deemed hopeless without endodontic intervention.`;
        if (narr === "deep_decay") narrativeBlock = "\nwarning: advised patient that due to deep decay, rct may be needed if sensitivity persists/worsens.";

        // Construct final string with single \n between categories
        document.getElementById('output').innerText = lines.join('\n') + narrativeBlock + "\n\n" + sig;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Note Copied!"); });
    }
</script>

</body>
</html>
