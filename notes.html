<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Siu's Master Note Generator</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-gen:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: white; }
        #output { margin-top: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-left: 5px solid #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #222; min-height: 150px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Siu's Note Generator</h2>

    <div class="grid">
        <div class="full">
            <label>1. Select Procedure Template</label>
            <select id="proc">
                <optgroup label="Exams">
                    <option value="np_exam">NP EXAM</option>
                    <option value="spec_exam">SPEC EXAM / EMERGENCY</option>
                    <option value="recall">RECALL EXAM</option>
                </optgroup>
                <optgroup label="Restorative">
                    <option value="composite">COMPOSITE BONDING</option>
                    <option value="pulp_cap">INDIRECT PULP CAP</option>
                    <option value="crown_prep">CROWN & CORE BUILDUP</option>
                    <option value="crown_del">CROWN DELIVERY</option>
                    <option value="fiber_post">FIBER POST & CORE BUILDUP</option>
                </optgroup>
                <optgroup label="Surgery & Endo">
                    <option value="simple_ext">SIMPLE EXTRACTION</option>
                    <option value="surg_ext">SURGICAL EXTRACTION</option>
                    <option value="endo">ENDO TREATMENT (RCT)</option>
                </optgroup>
                <optgroup label="Denture/Guard">
                    <option value="occ_records">OCCLUSAL RECORDS (WAX RIM)</option>
                    <option value="cd_del">CD DELIVERY</option>
                    <option value="og_scan">OCCLUSAL GUARD SCAN</option>
                </optgroup>
            </select>
        </div>

        <div class="full">
            <label>Chief Concern (CC)</label>
            <input type="text" id="ccManual" placeholder="e.g. Pain on biting upper right (overrides default)">
        </div>

        <div class="full">
            <label>Endo Diagnosis</label>
            <input type="text" id="endoDx" placeholder="e.g. Symptomatic Irreversible Pulpitis w/ Symptomatic Apical Periodontitis">
        </div>

        <div>
            <label>Tooth #</label>
            <input type="text" id="tooth" placeholder="e.g. 19">
        </div>
        <div>
            <label>Surface / Material / Shade</label>
            <input type="text" id="detail" placeholder="e.g. MOD / Zirconia / A2">
        </div>

        <div>
            <label>Anesthetic Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="citanest plain">Citanest Plain</option>
            </select>
        </div>
        <div>
            <label>Amount (Carps)</label>
            <select id="anesCarps">
                <option value="1">1 carp</option>
                <option value="2">2 carps</option>
                <option value="3">3 carps</option>
                <option value="0.5">0.5 carp</option>
            </select>
        </div>
    </div>

    <button class="btn-gen" onclick="generate()">Generate Master Note</button>
    <div id="output">Generated note will appear here...</div>
    <button class="btn-copy" onclick="copyText()">Copy to Clipboard</button>
</div>

<script>
    function generate() {
        const proc = document.getElementById('proc').value;
        const tooth = document.getElementById('tooth').value || "[#]";
        const detail = document.getElementById('detail').value || "[DETAIL]";
        const cc = document.getElementById('ccManual').value || "none";
        const endoDx = document.getElementById('endoDx').value || "[ENDO DX]";
        const anes = document.getElementById('anesCarps').value + " carp " + document.getElementById('anesType').value;
        
        const consent = "consent: risks and benefits discussed; patient consented to treatment and understands all risks.";
        const sig = "\n\nRSiu DMD; Assistant Leng.";

        let tx = "";
        let body = "";

        if (proc === "np_exam") {
            tx = "np exam, 4bws, pano, 3unit scale, polish/fluoride application.";
            body = `cc: ${cc}. mh: asa 1. ocs: negative. hygiene: fair. xrays: caries noted. bone wnl. perio dx: gingivitis. probing: 1-3mm. hyg: piezo, hs, ohi reviewed. polished. fluoride applied. 6mr recommended.`;
        } else if (proc === "composite") {
            tx = `#${tooth} ${detail} composite.`;
            body = `cc: ${cc}. mh: asa 1. tx rendered: risks/benefits/post-op sensitivity warning; anes ${anes}; cotton roll isolation; prep w/ hs/ls burs for caries removal; matrix w/ garrison sectional system; bond w/ selective enamel etch, clearfil se primer and bond; restorative w/ filtek supreme; occlusion checked; polished.`;
        } else if (proc === "endo") {
            tx = `#${tooth} RCT.`;
            body = `cc: ${cc}. mh: asa 1. dx: ${endoDx}. tx rendered: risks/benefits discussed; anes ${anes}; rubber dam isolation; access w/ hs bur; instrumentation using Vortex Blue; irrigation w/ NaOCl and EDTA; ultrasonic activation; canals dried; obturated using bioceramic sealer; temp restoration.`;
        } else if (proc === "spec_exam") {
            tx = "specific exam, imaging.";
            body = `cc: ${cc}. mh: asa 1. xrays: reveals periapical pathology/deep caries tooth #${tooth}. dx: ${endoDx}. tx rendered: clinical/radiographic exam performed; tx options (RCT vs EXT) discussed.`;
        } else {
            tx = `${proc.toUpperCase()} on tooth #${tooth}.`;
            body = `cc: ${cc}. tx rendered: procedure completed per protocol. patient tolerated well.`;
        }

        document.getElementById('output').innerText = `tx: ${tx}\n\n${body}\n${consent}${sig}`;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Copied!"); });
    }
</script>

</body>
</html>
