<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Siu's Dental Notes</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 750px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .field { flex: 1; min-width: 150px; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #555; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gen { background: #007bff; color: white; }
        .btn-copy { background: #28a745; color: white; margin-top: 15px; }
        #output { margin-top: 20px; background: #f8f9fa; padding: 20px; border: 1px dashed #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #333; min-height: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dental Note Generator</h2>

    <label>1. Select Procedure</label>
    <select id="procType" style="margin-bottom: 15px;">
        <optgroup label="Exams">
            <option value="np_exam">NP EXAM</option>
            <option value="spec_exam">SPEC EXAM / EMERGENCY</option>
            <option value="recall">RECALL EXAM</option>
        </optgroup>
        <optgroup label="Restorative">
            <option value="composite">COMPOSITE BONDING</option>
            <option value="pulp_cap">INDIRECT PULP CAP</option>
            <option value="crown_prep">CROWN & CORE BUILDUP</option>
            <option value="crown_del">CROWN DELIVERY</option>
        </optgroup>
        <optgroup label="Surgery & Endo">
            <option value="simple_ext">SIMPLE EXTRACTION</option>
            <option value="surg_ext">SURGICAL EXTRACTION</option>
            <option value="endo">ENDO TREATMENT (RCT)</option>
        </optgroup>
        <optgroup label="Dentures">
            <option value="prelim_imp">PRELIMINARY IMPRESSION</option>
            <option value="occ_records">OCCLUSAL RECORDS</option>
            <option value="cd_del">CD DELIVERY</option>
        </optgroup>
    </select>

    <label>2. Add Specific Narrative (Optional)</label>
    <select id="extraNarrative" style="margin-bottom: 15px;">
        <option value="">-- No Extra Narrative --</option>
        <option value="bruxism">Bruxism/Clenching Narrative</option>
        <option value="hopeless">Non-Restorable/Hopeless Narrative</option>
        <option value="decline_rct">Patient Declines RCT Narrative</option>
    </select>

    <div class="row">
        <div class="field">
            <label>Tooth #</label>
            <input type="text" id="toothNum" placeholder="e.g. 19">
        </div>
        <div class="field">
            <label>Surface / Material</label>
            <input type="text" id="surface" placeholder="e.g. MOD or Zirconia">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>Anesthetic Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="citanest plain">citanest plain</option>
            </select>
        </div>
        <div class="field">
            <label>Amount (Carps)</label>
            <select id="anesCarps">
                <option value="1">1 carp</option>
                <option value="2">2 carps</option>
                <option value="3">3 carps</option>
            </select>
        </div>
    </div>

    <label>Manual Entry: Caries Noted</label>
    <input type="text" id="cariesManual" placeholder="e.g. #3-O, #14-MO" style="margin-bottom: 15px;">

    <button class="btn-gen" onclick="generate()">Generate Note</button>

    <div id="output">Note will appear here...</div>

    <button class="btn-copy" onclick="copyText()">Copy Note</button>
</div>

<script>
    function generate() {
        const type = document.getElementById('procType').value;
        const extra = document.getElementById('extraNarrative').value;
        const tooth = document.getElementById('toothNum').value || "(#)";
        const surf = document.getElementById('surface').value || "(surf/mat)";
        const anes = document.getElementById('anesCarps').value + " carp " + document.getElementById('anesType').value;
        const manual = document.getElementById('cariesManual').value;
        
        let note = "";
        const consent = "consent: risks and benefits discussed; patient understood risks and consented to treatment.";
        const sig = "\n\nRSiu DMD; Assistant Leng.";
        const cariesLine = manual ? `caries noted on chart: ${manual}.` : "caries noted on chart.";

        if (type === "np_exam") {
            note = `NP EXAM\ntx: np exam, 4bws, pano, 3unit scale, polish/fluoride application.\n\ncc: none. mh: asa 1. ocs: negative for lesions. ${cariesLine}\nxrays: findings: caries noted. bone wnl. justification: screen for pathology. perio dx: gingivitis. probing: 1-3mm. hyg: piezo, hs, ohi reviewed. polished. fluoride applied. 6mr recommended. ${consent}`;
        } else if (type === "composite") {
            note = `COMPOSITE BONDING\ntx: #${tooth} ${surf} composite.\n\ncc: none. mh: asa 1. tx rendered: risks/benefits discussed; anes ${anes}; cotton roll isolation; prep w/ hs/ls burs for caries removal; matrix w/ garrison sectional system; bond w/ selective enamel etch, clearfil se primer and bond; restorative w/ filtek supreme; occlusion checked; polished. ${consent}`;
        } else if (type === "surg_ext") {
            note = `SURGICAL EXTRACTION\ntx: #${tooth} surgical extraction.\n\ncc: non-restorable. mh: asa 1. tx rendered: risks/benefits/dry socket discussed; anes ${anes}; mucoperiosteal flap reflected; bone removed w/ surgical bur; tooth sectioned and roots delivered; socket curetted; saline irrigation; sutures placed; hemostasis achieved. post-op: poi given. ${consent}`;
        } else {
            note = `PROCEDURE: ${type.toUpperCase()}\ntx rendered for tooth #${tooth}. ${consent}`;
        }

        let narrativeBlock = "";
        if (extra === "bruxism") narrativeBlock = "\n\nnarrative: evidence of bruxism/clenching with significant attrition. occlusal guard required to protect against further tooth wear.";
        if (extra === "hopeless") narrativeBlock = `\n\nnarrative: tooth #${tooth} non-restorable/hopeless due to deep subgingival caries. extraction medically necessary to eliminate infection.`;
        if (extra === "decline_rct") narrativeBlock = `\n\nnarrative: patient declined RCT and elects for extraction. tooth is deemed hopeless without endodontic intervention.`;

        document.getElementById('output').innerText = note + narrativeBlock + sig;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Copied!"); });
    }
</script>

</body>
</html>
