<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Generator</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { color: #007bff; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .full { grid-column: span 3; }
        .span-2 { grid-column: span 2; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .section-header { grid-column: span 3; font-weight: bold; font-size: 12px; color: #007bff; border-bottom: 1px solid #e7f3ff; padding-bottom: 4px; margin-top: 10px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-gen:hover { background: #0056b3; }
        .btn-copy { background: #28a745; color: white; }
        #output { margin-top: 20px; background: #fdfdfd; padding: 20px; border: 1px solid #ddd; border-left: 5px solid #007bff; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; color: #222; min-height: 400px; line-height: 1.2; }
    </style>
</head>
<body>

<div class="container">
    <h2>Note Generator</h2>

    <div class="grid">
        <div class="span-2">
            <label>Primary Procedure</label>
            <select id="proc1" class="proc-selector">
                <option value="none">-- Select Primary --</option>
            </select>
        </div>
        <div>
            <label>Secondary Procedure (Optional)</label>
            <select id="proc2" class="proc-selector">
                <option value="none">-- None --</option>
            </select>
        </div>

        <div class="full">
            <label>Narrative Dropdown</label>
            <select id="narrative">
                <option value="">-- None --</option>
                <option value="bruxism">Bruxism/Clenching Narrative</option>
                <option value="pulp_narrative">Indirect Pulp Cap Justification</option>
                <option value="non_restorable">Non-Restorable/Hopeless Narrative</option>
                <option value="deep_decay">Deep Decay / Potential RCT Warning</option>
                <option value="crown_structure">Crown Justification - Lack of Structure</option>
                <option value="crown_function">Crown Justification - Improve Function</option>
                <option value="crown_longevity">Crown Justification - Improve Longevity</option>
            </select>
        </div>

        <div class="span-2">
            <label>Chief Concern (CC)</label>
            <input type="text" id="ccManual" placeholder="e.g. Pain on biting upper right">
        </div>
        <div>
            <label>Teeth # and Surface</label>
            <input type="text" id="teethSurface" placeholder="e.g. 19-MOD">
        </div>
        <div class="span-2">
            <label>Allergies</label>
            <input type="text" id="allergies" placeholder="NKDA">
        </div>
        <div>
            <label>Recall Interval</label>
            <select id="recallInterval">
                <option value="3mr">3 Month Recall</option>
                <option value="4mr">4 Month Recall</option>
                <option value="6mr" selected>6 Month Recall</option>
                <option value="1yr">1 Year Recall</option>
                <option value="none">N/A</option>
            </select>
        </div>

        <div class="section-header">Anesthesia Details</div>
        <div>
            <label>Type</label>
            <select id="anesType">
                <option value="2% lido 1:100k epi">2% lido 1:100k epi</option>
                <option value="2% lido 1:200k epi">2% lido 1:200k epi</option>
                <option value="4% articaine 1:100k epi">4% articaine 1:100k epi</option>
                <option value="citanest plain">Citanest Plain</option>
            </select>
        </div>
        <div>
            <label>Amount (Carps)</label>
            <input type="number" id="anesCarps" step="0.1" min="0" value="1">
        </div>
        <div>
            <label>Injection Site</label>
            <select id="anesSite" onchange="toggleNeedle()">
                <option value="buccal infiltration">Buccal Infiltration</option>
                <option value="IAN block">IAN Block</option>
                <option value="mental nerve block">Mental Nerve Block</option>
                <option value="long buccal">Long Buccal</option>
                <option value="palatal infiltration">Palatal Infiltration</option>
                <option value="lingual infiltration">Lingual Infiltration</option>
                <option value="PDL">PDL</option>
            </select>
        </div>
        <div id="needleDiv" style="display:none;">
            <label>Needle Gauge (IAN Only)</label>
            <select id="needleGauge">
                <option value="long">Long Gauge</option>
                <option value="short">Short Gauge</option>
            </select>
        </div>

        <div class="section-header">Clinical Specifications</div>
        <div>
            <label>BP</label>
            <input type="text" id="bp" placeholder="120/80">
        </div>
        <div>
            <label>Shade/Material</label>
            <input type="text" id="shade" placeholder="A2 / Zirconia">
        </div>
        <div>
            <label>Scaling Units</label>
            <select id="scaling">
                <option value="1">1 unit</option><option value="2">2 units</option><option value="3" selected>3 units</option>
            </select>
        </div>
        <div class="span-2">
            <label>Diagnosis (Endo/Perio)</label>
            <input type="text" id="endoDx" placeholder="e.g. Symptomatic Irreversible Pulpitis">
        </div>
        <div>
            <label>Assistant Name</label>
            <input type="text" id="assistantName" value="Leng">
        </div>
        <div class="full">
            <label>Additional Notes</label>
            <input type="text" id="additionalNotes" placeholder="Anything specific to this visit not covered by the template">
        </div>
    </div>

    <button class="btn-gen" onclick="generate()">Generate Note</button>
    <div id="output">Generated note will appear here...</div>
    <button class="btn-copy" onclick="copyText()">Copy to Clipboard</button>
</div>

<script>
    const procLibrary = {
        "Exams": {
            "np_exam": "NP EXAM",
            "spec_exam": "SPEC EXAM / EMERGENCY",
            "recall": "RECALL EXAM"
        },
        "Preventive": {
            "sealant": "SEALANTS",
            "fl_varnish": "FLUORIDE VARNISH"
        },
        "Restorative": {
            "composite": "COMPOSITE BONDING",
            "pulp_cap": "INDIRECT PULP CAP",
            "pulpotomy": "PULPOTOMY",
            "crown_prep": "CROWN & CORE BUILDUP",
            "crack_crown": "CRACKED TOOTH CROWN",
            "crown_del": "CROWN DELIVERY",
            "fiber_post": "FIBER POST & CORE"
        },
        "Periodontal": {
            "srp_1_2": "SRP - 1-2 QUADRANTS (LA)",
            "srp_3_4": "SRP - 3-4 QUADRANTS (LA)",
            "full_debride": "FULL MOUTH DEBRIDEMENT",
            "perio_maint": "PERIODONTAL MAINTENANCE"
        },
        "Surgery & Endo": {
            "surg_ext": "SURGICAL EXTRACTION",
            "simple_ext": "SIMPLE EXTRACTION",
            "endo": "ENDO TREATMENT (RCT)",
            "postop_check": "POST-OP CHECK / SUTURE REMOVAL",
            "incision_drainage": "INCISION & DRAINAGE (I&D)",
            "frenectomy": "FRENECTOMY"
        },
        "Removable": {
            "prelim_imp": "PRELIMINARY IMPRESSION",
            "final_imp": "FINAL IMPRESSION",
            "occ_records": "OCCLUSAL RECORDS",
            "wax_tryin": "WAX TRY-IN",
            "cd_del": "CD DELIVERY",
            "rpd_survey": "RPD DIAGNOSTIC / SURVEY & DESIGN",
            "rpd_framework_tryin": "RPD FRAMEWORK TRY-IN (CAST)",
            "rpd_final_imp": "RPD MASTER/ALTERED CAST IMPRESSION",
            "rpd_wax_tryin": "RPD WAX/TOOTH TRY-IN",
            "rpd_delivery": "RPD DELIVERY (CAST/ACRYLIC)"
        },
        "Occlusal Guard": {
            "og_scan": "OCCLUSAL GUARD SCAN",
            "og_del": "OCCLUSAL GUARD DELIVERY"
        }
    };

    function populateSelectors() {
        const selectors = document.querySelectorAll('.proc-selector');
        selectors.forEach(sel => {
            for (const [group, procs] of Object.entries(procLibrary)) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = group;
                for (const [val, text] of Object.entries(procs)) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = text;
                    optGroup.appendChild(opt);
                }
                sel.appendChild(optGroup);
            }
        });
    }
    populateSelectors();

    function toggleNeedle() {
        const site = document.getElementById('anesSite').value;
        document.getElementById('needleDiv').style.display = (site === "IAN block") ? "block" : "none";
    }

    function getClinicalNote(procKey, data) {
        const { teeth, shade, cc, bp, anesStr, scal, endoDx, allergies } = data;
        let p = [];
        
        switch(procKey) {
            case "np_exam":
            case "recall":
                p.push(`tx: ${procKey === 'recall' ? 'recall exam' : 'np exam'}, 4bws, pano, ${scal}unit scale, polish/fluoride application.`);
                p.push(`cc: ${cc}`);
                p.push(`mh: reviewed and updated; stable asa 1. bp: ${bp}. allergies: ${allergies}`);
                p.push(`ocs: negative for lesions or lymphadenopathy. dental hx: hygiene fair. eoe/ioe: cl1 occlusion, 2-3mm oj, 50% ob. tmj: wnl. soft tissue wnl. caries noted on chart.`);
                p.push(`xrays: findings noted on chart. bone wnl. lower anterior radiographic calc. justification: screen for pathology.`);
                p.push(`perio dx: gingivitis w/ recession. probing: 1-3mm with localized bop. caries risk: moderate.`);
                p.push(`hyg: piezo, hs, ohi reviewed. polished. fluoride applied. 6mr recommended.`);
                break;
            case "spec_exam":
                p.push(`tx: spec exam, pa.`);
                p.push(`cc: ${cc}`);
                p.push(`mh: reviewed and updated; stable asa 1. bp: ${bp}. allergies: ${allergies}`);
                p.push(`clinical tests: percussion: (+/-), palpation: (+/-), cold test: (+/-), mobility: (0/1/2/3), probing: (wnl / pocketing noted).`);
                p.push(`dx: ${endoDx}`);
                p.push(`tx rendered: risks/benefits discussed. pa taken for tooth #${teeth}. interim treatment provided.`);
                break;
            case "composite":
                p.push(`tx: ${teeth} composite restoration`);
                p.push(`tx rendered: anes: ${anesStr}; cotton roll isolation; prep w/ hs/ls burs for caries removal; matrix w/ garrison sectional system and wooden wedge; bond w/ selective enamel etch, clearfil se primer (20s) and bond, light-cured; restorative w/ filtek supreme incremental application, light-cured; occlusion checked/adjusted; polished.`);
                break;
            case "pulp_cap":
                p.push(`tx: ${teeth} composite w/ indirect pulp cap`);
                p.push(`tx rendered: warning: rct may be needed; anes: ${anesStr}; cotton roll isolation; prep w/ hs/ls; indirect pulp cap w/ (dycal/vitrebond/limelite); matrix w/ garrison sectional system; bond w/ clearfil se; restorative w/ filtek supreme; occlusion adjusted; polished.`);
                break;
            case "pulpotomy":
                p.push(`tx: ${teeth} pulpotomy`);
                p.push(`tx rendered: warning: rct may be needed if symptoms persist; anes: ${anesStr}; rubber dam isolation; access into pulp chamber w/ hs bur; coronal pulp removed w/ round bur/spoon excavator; hemostasis achieved w/ sterile cotton pellet/pressure; formocresol/ferric sulfate applied to canal orifices; chamber lined w/ zoe/ihp base; tooth restored w/ (composite/stainless steel crown); occlusion checked/adjusted.`);
                break;
            case "crown_prep":
                p.push(`tx: ${teeth} (${shade}) crown & core buildup`);
                p.push(`narrative: tooth ${teeth} has insufficient remaining coronal structure to support a long-term direct restoration; full coverage crown recommended to restore form, improve masticatory function, and improve long-term longevity/prognosis of the tooth.`);
                p.push(`tx rendered: anes: ${anesStr}; shade selected (${shade}); cotton roll isolation; old restoration/caries excavated w/ hs/ls burs; remaining tooth structure and cuspal support assessed; core buildup placed w/ (limelite/vitrebond) base, clearfil se primer/bond, and filtek supreme composite core; tooth prepared for full coverage crown w/ adequate axial/occlusal reduction and defined margin; retraction cord (#00/0) placed for tissue management; margins refined and inspected for accuracy; digital impression captured w/ trios 3 scanner (prep, opposing arch, bite); provisional crown fabricated w/ bis-acrylic, contoured/polished, and cemented w/ temp-bond ne; occlusion and proximal contacts checked/adjusted; post-op/home care instructions given.`);
                break;
            case "crack_crown":
                p.push(`tx: ${teeth} (${shade}) crown & core buildup for crack`);
                p.push(`narrative: tooth ${teeth} presents with a cracked/fractured cusp compromising remaining structure; full coverage crown recommended to splint the tooth, restore function, and prevent further crack propagation, improving long-term longevity of the tooth.`);
                p.push(`tx rendered: anes: ${anesStr}; cotton roll isolation; caries/old restoration removed; crack traced and confirmed w/ tooth sleuth/transillumination; extent of fracture assessed; core buildup w/ (limelite/vitrebond) base and filtek supreme composite; tooth prepared for full coverage crown w/ adequate reduction and margin design; retraction cord placed; margins refined; digital impression w/ trios 3 scanner (prep, opposing, bite); provisional crown fabricated w/ bis-acrylic and cemented w/ temp-bond ne; occlusion and contacts adjusted; patient advised of guarded prognosis pending crack extent; post-op instructions given.`);
                break;
            case "crown_del":
                p.push(`tx: ${teeth} crown delivery`);
                p.push(`tx rendered: temp removed and prep cleaned of residual cement; permanent (${shade}) crown tried in; fit, margins, and proximal contacts verified; pre-cementation radiograph taken to confirm complete seating; isolation achieved w/ cotton rolls/retraction cord for moisture control; crown cemented w/ g-cem one; excess cement removed and margins checked circumferentially; post-cementation radiograph taken to confirm seating and absence of residual subgingival cement; occlusion adjusted.`);
                break;
            case "endo":
                p.push(`tx: ${teeth} RCT`);
                p.push(`tx rendered: anes: ${anesStr}; rubber dam isolation; access w/ hs bur; canals located and negotiated; working length determined w/ apex locator and confirmed radiographically; glide path established; mechanical instrumentation using Vortex Blue 0.04 taper rotary files (40, 35, 30, 25); irrigation w/ NaOCl/EDTA; ultrasonic activation; canals dried w/ paper points; obturated using single cone technique w/ gutta-percha and bioceramic sealer; post-obturation radiograph confirms adequate fill to working length; orifice sealed; temp restoration placed.`);
                break;
            case "simple_ext":
                p.push(`tx: ${teeth} extraction`);
                p.push(`tx rendered: anes: ${anesStr}; luxated and delivered w/ elevators and forceps; socket curetted; saline irrigation; hemostasis achieved w/ gauze pressure.`);
                p.push(`post-op instructions: bite firmly on gauze x30-60min; no rinsing/spitting/straw use for 24h; avoid smoking; intermittent ice pack to area for swelling; soft diet; analgesics as needed (ibuprofen/acetaminophen); call office if excessive bleeding, swelling, or signs of infection.`);
                break;
            case "srp_1_2":
                p.push(`tx: srp - 1-2 quadrants, teeth/area ${teeth}`);
                p.push(`tx rendered: probing depths reviewed; anes: ${anesStr} for patient comfort during subgingival instrumentation; scaling and root planing performed w/ ultrasonic (piezo) and hand instruments (gracey curettes) to remove subgingival calculus/biofilm; root surfaces planed smooth; irrigation w/ chlorhexidine; post-op sensitivity and homecare instructions reviewed; ohi reinforced (interdental brushes/floss); 3mr for re-eval/perio maintenance recommended.`);
                break;
            case "srp_3_4":
                p.push(`tx: srp - 3-4 quadrants, teeth/area ${teeth}`);
                p.push(`tx rendered: probing depths reviewed; anes: ${anesStr} for patient comfort during subgingival instrumentation; scaling and root planing performed w/ ultrasonic (piezo) and hand instruments (gracey curettes) to remove subgingival calculus/biofilm across remaining quadrants; root surfaces planed smooth; irrigation w/ chlorhexidine; post-op sensitivity and homecare instructions reviewed; ohi reinforced; 3mr for re-eval/perio maintenance recommended.`);
                break;
            case "full_debride":
                p.push(`tx: full mouth debridement`);
                p.push(`tx rendered: gross supra/subgingival deposits removed w/ ultrasonic scaler to enable adequate visualization and probing; comprehensive periodontal charting/exam deferred to follow-up visit; ohi reviewed; re-appointment scheduled for full perio assessment.`);
                break;
            case "perio_maint":
                p.push(`tx: periodontal maintenance`);
                p.push(`tx rendered: probing depths reviewed and charted; supra/subgingival scaling performed w/ ultrasonic and hand instruments; selective root planing on areas of residual calculus; polish; fluoride applied; ohi reinforced; 3-4mr recommended.`);
                break;
            case "surg_ext":
                p.push(`tx: ${teeth} surgical extraction`);
                p.push(`tx rendered: risks/benefits/paresthesia discussed; anes: ${anesStr}; mucoperiosteal flap reflected; bone removed w/ surgical hs bur; tooth sectioned and roots delivered; socket curetted; bone file used; interrupted gut plain sutures placed; hemostasis achieved w/ gauze pressure.`);
                p.push(`post-op instructions: bite firmly on gauze x30-60min; no rinsing/spitting/straw use for 24h; avoid smoking; ice pack intermittently for first 24h then warm compress; soft diet; analgesics/antibiotics per prescription; suture removal in 7-10 days if non-resorbable; call office if excessive bleeding, swelling, numbness, or signs of infection.`);
                break;
            case "prelim_imp":
                p.push(`tx: prelim imps for dentures. upper/lower alginate impressions taken in stock trays; landmarks including retromolar pads and vestibules captured.`);
                break;
            case "final_imp":
                p.push(`tx: final imps for dentures. custom trays verified; border molding w/ green stick compound; final impressions taken w/ PVS (light/medium body).`);
                break;
            case "occ_records":
                p.push(`tx: wax rim adjustment, jaw relation records. max rim adjusted for lip support/midline. mand rim adjusted for vdo/vdr. cr record captured w/ aluwax.`);
                break;
            case "wax_tryin":
                p.push(`tx: wax try-in for dentures. occlusion verified in CR; VDO/VDR confirmed; midline, phonetics (F/S), and esthetics approved by patient.`);
                break;
            case "cd_del":
                p.push(`tx: denture delivery. seated; pip paste used for pressure spots; occlusion verified in cr; selective grinding performed; ohi provided.`);
                break;
            case "rpd_survey":
                p.push(`tx: rpd diagnostic impressions, survey & design, teeth ${teeth}`);
                p.push(`tx rendered: diagnostic alginate impressions taken; diagnostic casts mounted and surveyed on dental surveyor; path of insertion determined; guide planes, rest seats, and clasp design planned (cast/acrylic framework discussed with patient); abutment teeth evaluated for required modifications (rest seat/guide plane prep); tx plan and design reviewed with patient.`);
                break;
            case "rpd_framework_tryin":
                p.push(`tx: rpd cast framework try-in, teeth ${teeth}`);
                p.push(`tx rendered: metal framework tried in; fit verified at rest seats and guide planes w/ no rocking or binding; clasps checked for passive fit w/o excess tissue blanching; occlusion w/ framework in place checked against opposing arch; framework returned to lab for record base and denture tooth set-up fabrication.`);
                break;
            case "rpd_final_imp":
                p.push(`tx: rpd master/altered cast impression, teeth ${teeth}`);
                p.push(`tx rendered: framework fit re-verified; secondary impression of edentulous ridge area(s) captured w/ PVS (light/medium body) using framework/custom tray (altered cast technique for distal extension areas, if applicable); impression sent to lab for master cast fabrication.`);
                break;
            case "rpd_wax_tryin":
                p.push(`tx: rpd wax/tooth try-in, teeth ${teeth}`);
                p.push(`tx rendered: framework and denture tooth set-up tried in; occlusion verified in cr; vdo/vdr confirmed; midline, phonetics (f/s), and esthetics approved by patient; clasp and rest seat fit re-verified.`);
                break;
            case "rpd_delivery":
                p.push(`tx: partial denture delivery (cast/acrylic), teeth ${teeth}`);
                p.push(`tx rendered: rpd tried in; framework fit, clasp retention, and rest seat contact verified; pip paste used to identify and relieve pressure spots on tissue-borne areas; occlusion verified in cr and adjusted via selective grinding; path of insertion/removal reviewed with patient; ohi and denture care instructions (removal at night, cleaning, soaking, avoiding excessive flexing of clasps) provided.`);
                break;
            case "og_scan":
                p.push(`tx: occlusal guard scan. digital impression taken w/ trios 3 scanner (u/l/bite); shade/material selected.`);
                break;
            case "og_del":
                p.push(`tx: occlusal guard delivery. seated; fit/retention verified; occlusion adjusted w/ articulating paper; care instructions given.`);
                break;
            case "sealant":
                p.push(`tx: sealants placed, teeth ${teeth}`);
                p.push(`tx rendered: teeth isolated and dried; enamel etched, rinsed, and dried; sealant material applied to pits/fissures and light-cured; occlusion checked.`);
                break;
            case "fl_varnish":
                p.push(`tx: fluoride varnish application`);
                p.push(`tx rendered: teeth dried; fluoride varnish applied to all surfaces; patient/parent advised to avoid hard/hot/chewy foods and to delay brushing for several hours.`);
                break;
            case "postop_check":
                p.push(`tx: post-op check / suture removal, area ${teeth}`);
                p.push(`tx rendered: surgical site examined; healing progressing as expected; sutures removed (if present); patient asymptomatic; no signs of infection, dry socket, or dehiscence; ohi reinforced.`);
                break;
            case "incision_drainage":
                p.push(`tx: incision & drainage (i&d), area ${teeth}`);
                p.push(`tx rendered: anes: ${anesStr}; area of fluctuant swelling identified and localized; incision made w/ #11 blade; purulent drainage expressed; area irrigated w/ saline; drain placed (if indicated); antibiotics prescribed; f/u appointment scheduled to monitor resolution.`);
                break;
            case "frenectomy":
                p.push(`tx: frenectomy`);
                p.push(`tx rendered: anes: ${anesStr}; frenum identified, isolated, and tensioned; excised w/ (scalpel/laser); hemostasis achieved; sutures placed as needed; post-op instructions given (stretching exercises, wound care, soft diet).`);
                break;
        }
        return p.join('\n');
    }

    function generate() {
        const data = {
            teeth: document.getElementById('teethSurface').value || "[#]",
            shade: document.getElementById('shade').value || "[SHADE]",
            cc: document.getElementById('ccManual').value || "none",
            bp: document.getElementById('bp').value || "not recorded",
            endoDx: document.getElementById('endoDx').value || "[DX]",
            scal: document.getElementById('scaling').value,
            allergies: document.getElementById('allergies').value || "NKDA",
            anesStr: `${document.getElementById('anesCarps').value} carp ${document.getElementById('anesType').value} via ${document.getElementById('anesSite').value}`
        };
        if (document.getElementById('anesSite').value === "IAN block") {
            data.anesStr += ` (${document.getElementById('needleGauge').value} needle); risk of transient (rare permanent) paresthesia disclosed to patient`;
        }

        const proc1 = document.getElementById('proc1').value;
        const proc2 = document.getElementById('proc2').value;
        const assistantName = document.getElementById('assistantName').value || "N/A";
        const sig = `RSiu DMD; Assistant ${assistantName}.`;
        const consent = "consent: risks, benefits, and alternatives discussed; patient understood all risks and explicitly consented to treatment.";
        const complications = "complications: none; patient tolerated procedure well.";

        let finalNote = "";
        if (proc1 !== "none") finalNote += getClinicalNote(proc1, data) + "\n\n";
        if (proc2 !== "none") finalNote += "--- ADDITIONAL PROCEDURE ---\n" + getClinicalNote(proc2, data) + "\n\n";

        const additionalNotes = document.getElementById('additionalNotes').value;
        if (additionalNotes) finalNote += `additional notes: ${additionalNotes}\n\n`;

        const narr = document.getElementById('narrative').value;
        let narrativeBlock = "";
        if (narr === "bruxism") narrativeBlock = "\nnarrative: evidence of bruxism/clenching with significant attrition and wear facets. occlusal guard required.";
        if (narr === "pulp_narrative") narrativeBlock = `\nnarrative: teeth ${data.teeth} presents with deep caries impacting structural integrity; crown is required to protect remaining cusps.`;
        if (narr === "non_restorable") narrativeBlock = `\nnarrative: teeth ${data.teeth} non-restorable/hopeless due to subgingival caries; extraction medically necessary.`;
        if (narr === "deep_decay") narrativeBlock = "\nwarning: advised patient that due to deep decay, rct may be needed.";
        if (narr === "crown_structure") narrativeBlock = `\nnarrative: teeth ${data.teeth} lack sufficient remaining sound tooth structure to reliably retain a direct restoration; full coverage crown indicated to restore structural integrity.`;
        if (narr === "crown_function") narrativeBlock = `\nnarrative: crown recommended for teeth ${data.teeth} to restore proper occlusal anatomy/contacts and improve chewing function.`;
        if (narr === "crown_longevity") narrativeBlock = `\nnarrative: crown recommended for teeth ${data.teeth} to protect remaining structure from fracture and improve long-term longevity/prognosis of the tooth.`;

        const recallInterval = document.getElementById('recallInterval').value;
        const recallLine = recallInterval === "none" ? "" : `\nrecall: ${recallInterval}`;

        document.getElementById('output').innerText = finalNote + complications + "\n" + consent + narrativeBlock + recallLine + "\n\n" + sig;
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => { alert("Combined Note Copied!"); });
    }
</script>
</body>
</html>
